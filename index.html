<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thread – Capture and Grow Your Ideas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f9fafb;
      color: #1f2937;
    }
    h1 {
      margin-top: 0;
      font-size: 2rem;
      color: #374151;
    }
    section {
      margin-bottom: 2rem;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      margin-right: 0.5rem;
      padding: 4px 8px;
      font-size: 0.9rem;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      cursor: pointer;
      background-color: #e5e7eb;
    }
    button:hover {
      background-color: #d1d5db;
    }
    .signal-card, .thread-card {
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 10px;
      background-color: #ffffff;
    }
    .card-header {
      font-weight: bold;
      margin-bottom: 4px;
    }
    .update-list {
      margin: 0.5rem 0 0;
      padding: 0;
      list-style: none;
    }
    .update-list li {
      margin-bottom: 4px;
      font-size: 0.9rem;
      color: #374151;
    }
    .recall-notice {
      padding: 8px;
      background-color: #fef3c7;
      border: 1px solid #fde68a;
      border-radius: 4px;
      margin-bottom: 10px;
      color: #92400e;
    }
  </style>
</head>
<body>
  <h1>Thread</h1>
  <section id="capture-section">
    <h2>Quick Capture</h2>
    <input id="signal-input" type="text" placeholder="Type your thought and press Enter..." autocomplete="off">
    <p>Capture short, raw thoughts. Signals are immutable once saved.</p>
  </section>

  <section id="review-section">
    <h2>Daily Review</h2>
    <div id="signals-container"></div>
  </section>

  <section id="threads-section">
    <h2>Threads</h2>
    <div id="threads-container"></div>
  </section>

  <section id="recall-section">
    <h2>Recall</h2>
    <div id="recall-container"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
